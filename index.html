<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xavier Dersy — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rammetto+One&display=swap" rel="stylesheet">
<style>
  :root{
    --item-width: 13.25rem;
    --item-height: 20rem;
    --content-max: 60rem;
  }
  @media screen and (min-width:768px){
    :root{ --item-width: 17.8rem; --item-height: 26rem; }
  }
  *,*:before,*:after{ box-sizing:border-box; }
  html{
    background:#333;
    min-height:100vh;
  }
  body{
    margin:0;
    background:#fff;
    color:#333;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    letter-spacing:-.4px;
    line-height:1.35;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-color-scheme:dark){
    body{ background:#333; color:#fff; }
    .social-anchor{ background:#fff; color:#333; }
    .back-btn{ background:#fff; color:#333; }
  }
  ::selection{ background:#333; color:#fff; }
  @media (prefers-color-scheme:dark){ ::selection{ background:#fff; color:#333; } }
  a{ color:inherit; text-decoration:none; }
  .link{ background-image:linear-gradient(currentColor,currentColor); background-position:0 1.2em; background-repeat:no-repeat; background-size:100% 2px; padding-bottom:2px; }
  .link:hover,.link:focus{ background-size:100% 3px; }

  .container{ max-width:var(--content-max); margin:0 auto; padding:4rem 1.5rem; }
  @media screen and (min-width:768px){ .container{ padding:5rem 3rem; } }

  .name{ font-family:'Rammetto One',cursive; font-weight:400; font-size:1.6rem; line-height:1.15; margin:0 0 1.25rem; }
  .name span{ display:block; }
  @media screen and (min-width:768px){ .name{ font-size:2rem; } }

  .intro{ max-width:40ch; margin:0 0 2.5rem; padding-right:1rem; }

  .social-links{ display:flex; gap:.9rem; margin-bottom:3.5rem; }
  .social-anchor{
    width:2.5rem; height:2.5rem; border-radius:50%;
    background:#333; color:#fff;
    display:flex; align-items:center; justify-content:center;
    transition:transform .15s ease;
  }
  .social-anchor:hover{ transform:translateY(-2px); }
  .social-anchor svg{ width:1.2rem; height:1.2rem; fill:currentColor; }

  .sub-heading{ font-family:'Rammetto One',cursive; font-weight:400; font-size:1.15rem; margin:0 0 1.5rem; }

  /* Experiments list — matches nick.computer's ListItem component exactly:
     a <ul> of items, each an external-link anchor with a small icon (that
     grows a colored circle behind it on hover) + title + description. */
  .list{ list-style:none; margin:0; padding:0; }
  .list-item{ margin-bottom:2.5rem; overflow:hidden; }
  .list-item:last-child{ margin-bottom:0; }
  .list-anchor{ display:inline-flex; align-items:flex-start; max-width:31rem; }
  .list-anchor:hover .list-title, .list-anchor:focus .list-title{ text-decoration:underline; }
  .list-icon-wrap{ height:2rem; width:2rem; margin-right:1rem; position:relative; flex:none; display:flex; align-items:center; justify-content:center; }
  .list-icon-circle{ position:absolute; inset:0; border-radius:50%; background:#333; opacity:0; transform:scale(.5); transition:opacity .2s ease, transform .2s ease; }
  .list-icon{ position:relative; z-index:1; width:1.15rem; height:1.15rem; fill:#333; transition:fill .2s ease; }
  .list-anchor:hover .list-icon-circle, .list-anchor:focus .list-icon-circle{ opacity:1; transform:scale(1.25); }
  .list-anchor:hover .list-icon, .list-anchor:focus .list-icon{ fill:#fff; }
  @media (prefers-color-scheme:dark){
    .list-icon{ fill:#fff; }
    .list-icon-circle{ background:#fff; }
    .list-anchor:hover .list-icon, .list-anchor:focus .list-icon{ fill:#333; }
  }
  .list-title{ margin:0 0 .35rem; font-size:1rem; }
  .list-para{ margin:0; font-size:.85rem; opacity:.7; max-width:31rem; }

  .cards{
    display:flex; gap:2rem;
    overflow-x:auto; overflow-y:hidden;
    padding:.5rem .1rem 1.5rem;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:thin;
  }
  .card{
    flex:none;
    width:var(--item-width);
    height:var(--item-height);
    display:flex; flex-direction:column;
    cursor:pointer;
    border:0; background:none; padding:0; text-align:left; font:inherit; color:inherit;
  }
  .card-media{
    width:100%; height:calc(var(--item-height) - 4.75rem); border-radius:14px; margin-bottom:1.1rem;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    box-shadow:0 10px 24px -6px rgba(0,0,0,.18);
    transition:transform .22s ease, box-shadow .22s ease;
  }
  .card-media svg{ width:62%; height:62%; }
  .card:hover .card-media, .card:focus-visible .card-media{
    transform:translateY(-6px);
    box-shadow:0 22px 34px -10px rgba(0,0,0,.28);
  }
  .card-title{ font-size:.95rem; text-transform:uppercase; letter-spacing:.03em; margin-bottom:.35rem; }
  .card-teaser{ font-size:.85rem; opacity:.65; }

  .detail{ display:none; }
  .detail.is-active{ display:block; }
  .home.is-hidden{ display:none; }

  .back-btn{
    width:2.5rem; height:2.5rem; border-radius:50%;
    background:#333; color:#fff; border:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:2.5rem;
  }
  .back-btn svg{ width:1.1rem; height:1.1rem; fill:currentColor; }

  .detail-media{
    width:6.5rem; height:6.5rem; border-radius:16px; margin-bottom:1.75rem;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    box-shadow:0 10px 24px -6px rgba(0,0,0,.18);
  }
  .detail-media svg{ width:62%; height:62%; }
  .detail-title{ font-family:'Rammetto One',cursive; font-weight:400; font-size:1.6rem; margin:0 0 1.75rem; }
  @media screen and (min-width:768px){ .detail-title{ font-size:2rem; } }

  .tool-list{ display:flex; flex-wrap:wrap; gap:.5rem; margin-bottom:2.25rem; }
  .tool-pill{
    font-size:.75rem; padding:.3rem .7rem; border-radius:999px;
    border:1px solid currentColor; opacity:.7;
  }

  .detail-body{ max-width:42rem; }
  .detail-body p{ margin:0 0 1.5rem; padding-right:1rem; }

  .placeholder-note{
    font-size:.75rem; opacity:.5; margin-top:4rem; padding-top:1.5rem;
    border-top:1px dashed currentColor;
  }
</style>
</head>
<body>
<main class="container">

  <section class="home" id="home">
    <h1 class="name"><span>Xavier</span><span>Dersy</span></h1>
    <p class="intro">Placeholder intro line — a sentence or two about what you do and who you help. Replace this with your own bio.</p>

    <div class="social-links">
      <a class="social-anchor" href="mailto:xavier.dersy@gmail.com" aria-label="Email">
        <svg viewBox="0 0 24 24"><path d="M2 4h20v16H2V4zm2 2v.01L12 12l8-5.99V6H4zm16 2.24-7.4 5.55a1 1 0 0 1-1.2 0L4 8.24V18h16V8.24z"/></svg>
      </a>
      <a class="social-anchor" href="https://github.com/nouillepascuite" target="_blank" rel="noopener" aria-label="GitHub">
        <svg viewBox="0 0 24 24"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.57.1.78-.25.78-.55v-2.14c-3.2.7-3.87-1.36-3.87-1.36-.53-1.33-1.29-1.69-1.29-1.69-1.05-.72.08-.7.08-.7 1.17.08 1.78 1.2 1.78 1.2 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.55-.29-5.23-1.28-5.23-5.68 0-1.26.45-2.28 1.19-3.08-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.64 1.59.24 2.76.12 3.05.74.8 1.19 1.82 1.19 3.08 0 4.41-2.69 5.38-5.25 5.67.42.36.78 1.07.78 2.16v3.2c0 .3.21.66.79.55A10.52 10.52 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/></svg>
      </a>
    </div>

    <h2 class="sub-heading">Work</h2>
    <div class="cards" id="cardsRow"></div>

    <h2 class="sub-heading" style="margin-top:3rem;">Experiments</h2>
    <ul class="list" id="experimentsRow"></ul>
  </section>

  <section class="detail" id="detail">
    <button class="back-btn" id="backBtn" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l4.88-4.88a1 1 0 1 0-1.42-1.41l-6.58 6.58a1 1 0 0 0 0 1.42l6.58 6.58a1 1 0 0 0 1.42-1.41L7.83 13H20a1 1 0 0 0 0-2Z"/></svg>
    </button>
    <div id="detailContent"></div>
  </section>

</main>

<script>
  // ---- Placeholder project data — replace title/teaser/body/tools/color per project. ----
  const PROJECTS = [
    { id:'project-one',   title:'Project One',   teaser:'A short one-line teaser.', color:'#F45D48', tools:['React','Figma'],
      body:'Placeholder case-study copy for Project One. Replace with the real story: the problem, your approach, and the outcome.' },
    { id:'project-two',   title:'Project Two',   teaser:'A short one-line teaser.', color:'#3F8EFC', tools:['Vue','Node'],
      body:'Placeholder case-study copy for Project Two. Replace with the real story: the problem, your approach, and the outcome.' },
    { id:'project-three', title:'Project Three', teaser:'A short one-line teaser.', color:'#FFC145', tools:['Swift','Sketch'],
      body:'Placeholder case-study copy for Project Three. Replace with the real story: the problem, your approach, and the outcome.' },
    { id:'project-four',  title:'Project Four',  teaser:'A short one-line teaser.', color:'#2EC4B6', tools:['Python','AWS'],
      body:'Placeholder case-study copy for Project Four. Replace with the real story: the problem, your approach, and the outcome.' },
    { id:'project-five',  title:'Project Five',  teaser:'A short one-line teaser.', color:'#9B5DE5', tools:['TypeScript','GraphQL'],
      body:'Placeholder case-study copy for Project Five. Replace with the real story: the problem, your approach, and the outcome.' },
    { id:'project-six',   title:'Project Six',   teaser:'A short one-line teaser.', color:'#FF6F91', tools:['Three.js','WebGL'],
      body:'Placeholder case-study copy for Project Six. Replace with the real story: the problem, your approach, and the outcome.' }
  ];

  // nick.computer's Experiments section links each item straight out to an
  // external demo (target=_blank), rather than an internal detail page —
  // replicated here with placeholder hrefs until real experiments/links exist.
  const EXPERIMENTS = [
    { href:'#', title:'Experiment One, 2024',   desc:'Mockup text standing in for a short write-up of this experiment — what you were exploring and what came out of it.' },
    { href:'#', title:'Experiment Two, 2023',   desc:'Mockup text standing in for a short write-up of this experiment — what you were exploring and what came out of it.' },
    { href:'#', title:'Experiment Three, 2022', desc:'Mockup text standing in for a short write-up of this experiment — what you were exploring and what came out of it.' }
  ];
  const LIST_ICON = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2 14.5 9.5 22 12 14.5 14.5 12 22 9.5 14.5 2 12 9.5 9.5Z"/></svg>';

  // Simple abstract placeholder mark so each card/detail has *something* distinct
  // to look at until real illustrations exist.
  function placeholderMark(color, seed){
    const a = 30 + (seed * 37) % 40;
    const b = 30 + (seed * 61) % 40;
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" rx="20" fill="${color}22"/>
      <circle cx="${a}" cy="40" r="26" fill="${color}"/>
      <circle cx="${100-b}" cy="62" r="20" fill="${color}bb"/>
    </svg>`;
  }

  function renderCards(list, containerId){
    const row = document.getElementById(containerId);
    list.forEach((p, i)=>{
      const btn = document.createElement('button');
      btn.className = 'card';
      btn.innerHTML = `
        <span class="card-media" style="background:${p.color}22">${placeholderMark(p.color, i+1)}</span>
        <span class="card-title">${p.title}</span>
        <span class="card-teaser">${p.teaser}</span>
      `;
      btn.addEventListener('click', ()=>{ location.hash = p.id; });
      row.appendChild(btn);
    });
  }
  function renderList(list, containerId){
    const ul = document.getElementById(containerId);
    list.forEach((item)=>{
      const li = document.createElement('li');
      li.className = 'list-item';
      li.innerHTML = `
        <a class="list-anchor" href="${item.href}" target="_blank" rel="noopener noreferrer">
          <span class="list-icon-wrap">
            <span class="list-icon-circle"></span>
            ${LIST_ICON.replace('<svg ', '<svg class="list-icon" ')}
          </span>
          <span>
            <h3 class="list-title">${item.title}</h3>
            <p class="list-para">${item.desc}</p>
          </span>
        </a>
      `;
      ul.appendChild(li);
    });
  }

  renderCards(PROJECTS, 'cardsRow');
  renderList(EXPERIMENTS, 'experimentsRow');

  const homeEl = document.getElementById('home');
  const detailEl = document.getElementById('detail');
  const detailContent = document.getElementById('detailContent');
  document.getElementById('backBtn').addEventListener('click', ()=>{ location.hash = ''; });

  function renderDetail(p){
    detailContent.innerHTML = `
      <span class="detail-media" style="background:${p.color}22">${placeholderMark(p.color, p.title.length)}</span>
      <h1 class="detail-title">${p.title}</h1>
      <div class="tool-list">${p.tools.map(t=>`<span class="tool-pill">${t}</span>`).join('')}</div>
      <div class="detail-body"><p>${p.body}</p></div>
    `;
  }

  function route(){
    const id = location.hash.replace('#','');
    const p = PROJECTS.find(x=>x.id===id);
    if(p){
      renderDetail(p);
      homeEl.classList.add('is-hidden');
      detailEl.classList.add('is-active');
      window.scrollTo(0,0);
    } else {
      homeEl.classList.remove('is-hidden');
      detailEl.classList.remove('is-active');
    }
  }
  window.addEventListener('hashchange', route);
  route();
</script>

</body>
</html>
